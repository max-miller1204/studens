<!--
Step-through teaching contract v1. Copy a section inside data-cl-after-pretest,
outside every form. Use a unique data-stepper-id. No additional scripts needed.
Required: version=1, title, domain (process/state-machine/pipeline/algorithm), mode.
trace requires 2–64 steps, each with title, state, transition, explanation; optional
mermaid. These are AUTHOR-SUPPLIED ordered snapshots, not a computed simulation.
Explain the causal transition and all assumptions. Repeated state names are allowed.
prefix-sum requires domain algorithm and values: 1–12 integers in [-100,100].
Only this built-in reducer computes results. Do not supply steps or result fields.
Learners explicitly Recompute edited inputs; this resets the run to step zero.
Unknown fields/malformed input are errors. No implicit coercion or hidden branches.
Strings are plain text; state/explanation retain newlines and support the existing
Temml delimiters \( \) and \[ \]. Use Mermaid in mermaid, with plain text labels;
do not put TeX in Mermaid labels. State, transition, explanation remain readable
without interpreting the image. MathML and SVG are generated by local renderers.
Escape < as \u003c in JSON scripts, especially </script>; use toScriptJson in code.
Back/Next/Reset/Play/Pause only explore this local trace. Play stops at the final
state and pauses on manual navigation, hidden page, unmount, and reduced motion.
Reload starts over. No persistence, submission, grading, score, model turn,
retention or review evidence. No private plan/key entries for these widgets.
All content is public teaching. Use different cases/values for private graded checks.
No CDN, backend simulation, executable config, inferred learning progress or claim
of human learning. Authors remain responsible for correctness of supplied traces.
-->
<section class="cl-stepper cl-card-box" data-stepper-id="water">
  <h2>Water changes phase</h2>
  <p>Follow heat entering water at standard pressure.</p>
  <script type="application/json" data-cl-stepper>
    {
      "version": 1,
      "title": "Water changes phase",
      "domain": "process",
      "mode": "trace",
      "steps": [
        {
          "title": "Warm liquid",
          "state": "Phase: liquid\nTemperature: 20 °C",
          "transition": "Initial state",
          "explanation": "At standard pressure, energy first raises liquid temperature.",
          "mermaid": "flowchart LR\nL[Liquid 20 C] --> H[Add heat]"
        },
        {
          "title": "Reach boiling",
          "state": "Phase: liquid\nTemperature: 100 °C",
          "transition": "Heating raises temperature to the boiling point",
          "explanation": "Under the stated pressure, boiling can begin at 100 °C.",
          "mermaid": "flowchart LR\nL[Liquid 100 C] --> H[Continue heating]"
        },
        {
          "title": "Vaporize",
          "state": "Phase: liquid and vapor\nTemperature: 100 °C",
          "transition": "Additional heat changes phase",
          "explanation": "During boiling, added energy changes phase rather than raising temperature. \\(Q=mL\\) for the vaporized mass.",
          "mermaid": "flowchart LR\nL[Liquid] -->|Heat| V[Vapor]"
        }
      ]
    }
  </script>
</section>
<section class="cl-stepper cl-card-box" data-stepper-id="door">
  <h2>A door controller</h2>
  <p>Distinguish latch state from door state.</p>
  <script type="application/json" data-cl-stepper>
    {
      "version": 1,
      "title": "A door controller",
      "domain": "state-machine",
      "mode": "trace",
      "steps": [
        {
          "title": "Locked",
          "state": "Door: closed\nLatch: locked",
          "transition": "Initial state",
          "explanation": "A push cannot open a locked latch.",
          "mermaid": "stateDiagram-v2\n[*] --> Locked\nLocked --> Unlocked: valid key"
        },
        {
          "title": "Unlocked",
          "state": "Door: closed\nLatch: unlocked",
          "transition": "A valid key releases the latch",
          "explanation": "The key changes latch state; the door is still closed.",
          "mermaid": "stateDiagram-v2\nLocked --> Unlocked: valid key\nUnlocked --> Open: push"
        },
        {
          "title": "Open",
          "state": "Door: open\nLatch: unlocked",
          "transition": "A push opens the unlocked door",
          "explanation": "The push changes door state because the latch is already unlocked.",
          "mermaid": "stateDiagram-v2\nUnlocked --> Open: push\nOpen --> Closed: pull"
        }
      ]
    }
  </script>
</section>
<section class="cl-stepper cl-card-box" data-stepper-id="packet">
  <h2>A packet moves through a pipeline</h2>
  <p>Follow the packet from receiving to output.</p>
  <script type="application/json" data-cl-stepper>
    {
      "version": 1,
      "title": "A packet moves through a pipeline",
      "domain": "pipeline",
      "mode": "trace",
      "steps": [
        {
          "title": "Receive",
          "state": "Packet A: waiting\nOutput: empty",
          "transition": "Initial state",
          "explanation": "The receiver has a packet; no stage has emitted output. Let \\(n=1\\).",
          "mermaid": "flowchart LR\nR[Receive A] --> D[Decode empty] --> E[Emit empty]"
        },
        {
          "title": "Decode",
          "state": "Packet A: decoded\nOutput: empty",
          "transition": "Receive passes A to decode",
          "explanation": "Decode consumes the waiting packet and produces a parsed record; emitting still waits.",
          "mermaid": "flowchart LR\nR[Receive empty] --> D[Decode A] --> E[Emit empty]"
        },
        {
          "title": "Emit",
          "state": "Packet A: complete\nOutput: A",
          "transition": "Decode passes the parsed record to emit",
          "explanation": "Emit consumes the decoded record. The output now contains A.",
          "mermaid": "flowchart LR\nR[Receive empty] --> D[Decode empty] --> E[Emit A]"
        }
      ]
    }
  </script>
</section>
<section class="cl-stepper cl-card-box" data-stepper-id="prefix">
  <h2>Accumulate a prefix</h2>
  <p>Predict how the next input changes the running sum.</p>
  <script type="application/json" data-cl-stepper>
    {
      "version": 1,
      "title": "Accumulate a prefix",
      "domain": "algorithm",
      "mode": "prefix-sum",
      "values": [4, -1, 6]
    }
  </script>
</section>
